; ============================================================
; Excel批量生成工具配置文件
; ============================================================
; 路径说明：
;   - 相对路径：相对于程序所在目录
;   - 绝对路径：使用完整路径（如 D:/my_config）
; ============================================================

[PATHS]
config_dir = config
log_dir = logs

[LOG]
level = INFO
max_files = 30
console_output = true
file_output = true

