; ============================================================
; Excel批量生成工具 - 配置文件
; ============================================================
; 路径说明：相对路径相对于程序所在目录
; ============================================================

[PATHS]
config_dir = config
log_dir = logs
templates_dir = config/templates

[LOG]
level = INFO
max_files = 30
console_output = true
file_output = true

[AUTO]
enabled = false
time = 07:00
products = 
types = 首件,过程,成品
range_mode = hybrid
auto_default_days = 30
run_mode = scheduled
exit_after_run = true
check_template_exists = true

[EMAIL]
enabled = false
smtp_server = smtp.qq.com
smtp_port = 465
smtp_ssl = true
smtp_tls = false
username = 
password = 
to = 
cc = 
subject = Excel生成报告 - {date}
report_level = detailed
send_only_on_error = false
timeout = 30